name: release-memory

# Extension release for the devin-memory VS Code adapter — tag
# `memory-vX.Y.Z` mints the GitHub release with the packaged .vsix and
# fans out to the reusable release.yml@v1: extension-only detect →
# vscode-ext lint → vsce → VS Code Marketplace (Entra OIDC) → Open VSX
# (OVSX_PAT).
#
# This repo ships the devin-memory wheel too (root pyproject.toml), but
# on an INDEPENDENT version line (0.3.x vs the extension's 0.1.x) — the
# reusable's tag gate and lockstep lint would reject `memory-v*` tags
# against pyproject 0.3.x, so `package-dir` points at the extension
# directory: detect finds no pyproject.toml there and the fan-out runs
# the documented extension-only path (verify/PyPI legs skip with a
# warning). The wheel keeps publishing through this repo's own
# pypi-publish.yml, dispatched explicitly below — `gh release create`
# with GITHUB_TOKEN does not emit a `release.published` event, so the
# PyPI leg would otherwise never fire.
#
# Marketplace: needs federated credential `gh-devin-brain-release` on
# the devin-vscode-marketplace app registration (subject
# repo:Icaro0310/devin-brain:environment:release) — the Azure login
# step fails loudly until it exists. AZURE_CLIENT_ID/AZURE_TENANT_ID
# vars are already set on the repo.

on:
  push:
    tags:
      - "memory-v*"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # dispatch pypi-publish.yml after the release — see below

jobs:
  # Shared prerequisite: a mistagged `memory-vX.Y.Z` must fail HERE,
  # before either the release job or the fan-out publishes anything.
  # `release` and `fanout` both declare `needs: validate`, so the
  # extension can never ship under a label that disagrees with the
  # manifest. The tag names the EXTENSION version only — the wheel is
  # versioned independently and is not bound to `memory-v*` tags.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag matches extension manifest
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#memory-v}"
          got_ext=$(python3 -c "import json; print(json.load(open('adapters/vscode/package.json'))['version'])")
          if [ "$want" != "$got_ext" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' ($want) vs adapters/vscode/package.json $got_ext"
            exit 1
          fi

  release:
    needs: validate
    # GitHub release creation stays tag-push-only — a dispatch (even
    # against an existing tag ref) only runs `validate`.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build and package the extension
        working-directory: adapters/vscode
        run: |
          # No lockfile in this extension — `npm ci` would fail; the
          # manifest is plain JS with no runtime deps and no build.
          npm install --no-audit --no-fund
          npx @vscode/vsce package --no-dependencies -o devin-memory.vsix

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Idempotent: a rerun after a partial failure uploads over the
          # existing release instead of dying on `gh release create`.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              adapters/vscode/devin-memory.vsix --clobber
          else
            gh release create "$RELEASE_TAG" \
              adapters/vscode/devin-memory.vsix \
              --verify-tag --generate-notes
          fi

      # `gh release create` with GITHUB_TOKEN does NOT emit a
      # `release.published` event — GitHub blocks recursive workflow
      # triggers from the same token — so pypi-publish.yml would never
      # fire on its own and the PyPI leg would be silently lost.
      # Dispatch it explicitly on the tag instead.
      - name: Trigger PyPI publish workflow
        # continue-on-error: a memory-v* tag carries no new wheel version,
        # so this dispatch is an idempotent re-verify (skip-existing). A
        # transient `gh workflow run` failure must not fail `release` and
        # starve the fanout leg — same treatment as release-qa-pack.yml.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run pypi-publish.yml --ref "$RELEASE_TAG"

  fanout:
    needs: [validate, release]
    # Publish legs only ever run on a real tag push after the GitHub
    # release succeeded — a workflow_dispatch must not publish to the
    # registries (the reusable's own tag gate is tag-only too).
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # Every scope the reusable requests must be granted here — a
    # missing scope fails the whole run at startup_failure.
    permissions:
      contents: read
      id-token: write   # Entra OIDC + cosign keyless
      packages: write   # docker leg scope
    uses: Icaro0310/devin-powerups/.github/workflows/release.yml@v1
    # Explicit mapping, not `inherit`: forwards only the Open VSX token.
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    with:
      # Extension-only release: adapters/vscode has no pyproject.toml,
      # so detect marks has-wheel=false and the verify/PyPI/docker legs
      # skip. Pointing at "." instead would read the root wheel
      # pyproject (0.3.x) and fail both the tag gate and the lockstep
      # lint — the extension ships on its own version line.
      package-dir: adapters/vscode
      vscode-ext-dir: adapters/vscode
