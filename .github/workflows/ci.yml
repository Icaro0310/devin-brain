name: ci
# Intentionally NOT a thin caller: Installs sibling deps from git pins before pip install -e.
# See Icaro0310/devin-powerups .github/workflows/VARIANTS.md.


on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        # sibling deps resolve from PyPI at release time; CI installs them
        # from git so main stays green before the packages are published
        run: |
          pip install "devin-redact @ git+https://github.com/Icaro0310/devin-redact.git" "devin-internals-spec @ git+https://github.com/Icaro0310/devin-internals-spec.git"
          pip install -e ".[dev]" --no-deps
          pip install "pytest>=8"

      - name: Test
        run: pytest -q

  secrets-scan:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/secrets-scan.yml@v1
