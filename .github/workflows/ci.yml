name: ci
# Intentionally NOT a thin caller: Installs sibling deps from git pins before pip install -e.
# See Icaro0310/devin-powerups .github/workflows/VARIANTS.md.


on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Enable git long paths (windows)
        if: runner.os == 'Windows'
        # devin-internals-spec ships fixture trees deeper than MAX_PATH;
        # without this, pip's git clone fails checkout and the sibling
        # never installs (ModuleNotFoundError: devin_internals)
        run: git config --global core.longpaths true

      - name: Install
        # sibling deps resolve from PyPI at release time; CI installs them
        # from git so main stays green before the packages are published.
        # --no-deps keeps PyPI versions of those siblings out of the test
        # env; test deps not shipped by the package (pytest, mcp, pyyaml
        # for tests/test_release_workflow.py) are hand-listed below.
        run: |
          pip install "devin-redact @ git+https://github.com/Icaro0310/devin-state.git#subdirectory=packages/redact" "devin-internals-spec @ git+https://github.com/Icaro0310/devin-internals-spec.git"
          pip install -e ".[dev]" --no-deps
          pip install "pytest>=8" "mcp>=1.9" "pyyaml"

      - name: Test
        run: pytest -q

  adapter-vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test VS Code adapter
        # bare `node --test` auto-discovers test/*.test.js — a positional
        # glob only works on Node >=22 and never inside quotes; the tests
        # are pure JS and run on every supported Node.
        working-directory: adapters/vscode
        run: node --test

  secrets-scan:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/secrets-scan.yml@v1

  adapters-check:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/adapters-check.yml@v1
  config-restricted-check:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/config-restricted-check.yml@v1
