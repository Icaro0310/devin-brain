name: bootstrap-approve-100

# One-shot self-bootstrap for PR #100 (v1.17 caller bump).
# pull_request_review_comment runs from PR HEAD — self-sufficient.
# Scope pinned to PR 100 + 'bootstrap-approve' in comment body.

on:
  pull_request_review_comment:
    types: [created]

permissions:
  pull-requests: write
  statuses: read

jobs:
  approve:
    if: >-
      github.event.pull_request.number == 100 &&
      github.event.pull_request.state == 'open' &&
      contains(github.event.comment.body, 'bootstrap-approve')
    runs-on: ubuntu-latest
    steps:
      - name: approve
        run: >-
          gh pr review 100 -R Icaro0310/devin-brain --approve
          --body "bootstrap via head-ref workflow (one-shot, PR #100 only)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
