[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-memory"
version = "0.2.0"
description = "Anti-poisoning memory layer for Devin — reviewed, versioned, provenance-tracked durable memory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
    "devin-redact @ git+https://github.com/Icaro0310/devin-redact.git@v0.2.0",
  "devin-internals-spec @ git+https://github.com/Icaro0310/devin-internals-spec.git@v0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devin-memory = "devin_memory.cli:main"
devin-learning = "devin_memory.learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
